[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "cantonese-rs"
version = "0.1.0"
description = "Cantonese language parser/compiler with Python runtime"
readme = "README.md"
requires-python = ">=3.7"

[tool.maturin]
manifest = "Cargo.toml"
python-source = "python"
module-name = "cantonese_rs._core"
features = ["python"]
