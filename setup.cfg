[metadata]
version = 1.0.11
license_files = LICENSE
name = Cantonese
author = Stepfen Shawn
author_email = stepfencurryxiao@gmail.com
description = The Cantonese programming language
url = https://github.com/StepfenShawn/Cantonese
project_urls =
    Cantonese source = https://github.com/StepfenShawn/Cantonese
classifiers =
	Intended Audience :: Developers
    License :: OSI Approved :: MIT License
	Natural Language :: English
	Natural Language :: Cantonese
	Operating System :: MacOS :: MacOS X
	Operating System :: POSIX
	Operating System :: POSIX :: BSD
	Operating System :: POSIX :: Linux
	Operating System :: Microsoft :: Windows
	Programming Language :: Python
	Programming Language :: Python :: 3
	Programming Language :: Python :: 3 :: Only
	Programming Language :: Python :: 3.9
	Programming Language :: Python :: 3.10
	Programming Language :: Python :: 3.11
	Programming Language :: Python :: 3.12

[options]
packages = cantonese_rs
python_requires = >=3.9
install_requires=
	setuptools >= 0.7.0
	pygments >= 2.12.0
include_package_data = True

[options.entry_points]
console_scripts =
	cantonese = cantonese_rs.cantonese:main
